<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>복리후생 안내</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#00205B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="복리후생">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon.png">
<style>
  .install { position:fixed; left:12px; right:12px; bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 10px); z-index:20;
    display:flex; align-items:center; gap:10px; background:var(--navy); color:#fff; border-radius:16px; padding:10px 10px 10px 12px;
    box-shadow:0 8px 24px rgba(0,32,91,.3); max-width:616px; margin:0 auto; }
  .install[hidden] { display:none; }
  .install img { width:40px; height:40px; border-radius:10px; display:block; }
  .install .ins-txt { flex:1; min-width:0; font-size:13px; line-height:1.4; }
  .install .ins-txt b { display:block; font-size:14px; color:var(--orange); }
  .install button { border:0; font:inherit; cursor:pointer; }
  .install #ins-btn { background:var(--orange); color:#3D2400; font-weight:800; border-radius:10px; padding:8px 12px; }
  .install #ins-x { background:transparent; color:#fff; opacity:.7; font-size:16px; width:32px; height:32px; }
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    /* CI: HI Navy / HI Orange (+ 보조색) */
    --navy:#00205B; --navy-dark:#001845; --navy-soft:#E8EDF7;
    --orange:#FF9E1B; --orange-deep:#FF7F32; --orange-soft:#FFF2DF;
    --yellow:#FFC56E; --purple:#7D55C7; --blue:#418FDE;
    --bg:#F4F6FB; --card:#FFFFFF; --text:#14213D; --body:#3A4560; --muted:#6B7590; --line:#E2E7F0;
    --danger:#B3261E; --danger-soft:#FBEAEA;
    --radius:18px; --nav-h:64px;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body {
    font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:var(--bg); color:var(--text); font-size:16px; line-height:1.6;
    -webkit-font-smoothing:antialiased; word-break:keep-all; overflow-wrap:anywhere;
  }

  /* ── 상단 ── */
  .appbar { position:sticky; top:0; z-index:10; background:var(--navy); color:#fff;
    padding:10px 8px 10px 16px; padding-top:calc(10px + env(safe-area-inset-top));
    display:flex; align-items:center; justify-content:space-between; }
  .brand { display:flex; align-items:center; gap:10px; }
  .brand-mark { width:30px; height:30px; border-radius:9px; background:#fff; display:grid; place-items:center; }
  .brand-mark img { width:18px; height:18px; display:block; }
  .hello .wm { position:absolute; left:-18px; bottom:-34px; width:118px; height:118px; opacity:.09; transform:rotate(-12deg); pointer-events:none; }
  .appbar h1 { margin:0; font-size:18px; font-weight:700; letter-spacing:-.2px; }
  .icon-btn { background:transparent; border:0; color:#fff; width:44px; height:44px; border-radius:50%;
    display:grid; place-items:center; cursor:pointer; }
  .icon-btn:active { background:rgba(255,255,255,.15); }

  main { max-width:640px; margin:0 auto; padding:16px 16px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom)); }
  .tab { display:none; }
  .tab.active { display:block; }
  .hello { background:var(--navy); color:#fff; border-radius:var(--radius); padding:18px 18px 16px; margin-bottom:16px; position:relative; overflow:hidden; }
  .hello::after { content:''; position:absolute; right:-30px; top:-30px; width:120px; height:120px; border-radius:50%; background:var(--orange); opacity:.9; }
  .hello b { color:var(--orange); }
  .hello p { margin:0; position:relative; z-index:1; }
  .hello .big { font-size:19px; font-weight:800; margin-bottom:4px; }
  .hello .small { font-size:14px; opacity:.85; }
  .hello .emoji { position:absolute; right:18px; top:16px; font-size:34px; z-index:1; }
  .section-title { font-size:20px; font-weight:800; margin:4px 0 12px; letter-spacing:-.3px; }

  /* ── 카드 ── */
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); margin-bottom:10px; overflow:hidden;
    box-shadow:0 1px 2px rgba(0,32,91,.04); }
  details.card > summary { list-style:none; padding:14px 16px; cursor:pointer; display:flex; gap:12px; align-items:center; }
  details.card > summary::-webkit-details-marker { display:none; }
  details.card[open] > summary { border-bottom:1px dashed var(--line); }
  .sum-main { flex:1; min-width:0; }
  .sum-title { font-weight:700; }
  .sum-meta { font-size:13px; color:var(--muted); margin-top:2px; }
  .chev { flex:none; color:var(--muted); transition:transform .2s; }
  details[open] .chev { transform:rotate(180deg); }
  .body { padding:14px 16px 16px; color:var(--body); }
  .card.important { border-color:var(--orange); box-shadow:inset 4px 0 0 var(--orange); }
  .ico { flex:none; width:40px; height:40px; border-radius:14px; display:grid; place-items:center; font-size:21px; background:var(--c-soft, var(--navy-soft)); }

  .badge { display:inline-block; font-size:12px; font-weight:700; padding:2px 8px; border-radius:999px; margin-right:6px; vertical-align:1px; }
  .badge.important { background:var(--orange); color:#3D2400; }
  .badge.done { background:var(--navy-soft); color:var(--navy); }
  .badge.wait { background:#EEF0F4; color:var(--muted); }

  /* ── 복리후생 분류 타일 ── */
  .tiles { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-bottom:14px; }
  .tile { border:1px solid var(--line); background:#fff; border-radius:16px; padding:12px 6px 10px; cursor:pointer; font:inherit;
    display:flex; flex-direction:column; align-items:center; gap:6px; color:var(--text); }
  .tile .t-ico { width:42px; height:42px; border-radius:14px; display:grid; place-items:center; font-size:22px; background:var(--c-soft, var(--navy-soft)); }
  .tile .t-name { font-size:13px; font-weight:600; line-height:1.3; text-align:center; }
  .tile .t-cnt { font-size:11px; color:var(--muted); }
  .tile.active { border-color:var(--navy); box-shadow:0 0 0 2px var(--navy) inset; }
  .tile.active .t-name { color:var(--navy); font-weight:800; }
  .group-label { display:flex; align-items:center; gap:8px; font-size:15px; font-weight:800; color:var(--navy); margin:18px 2px 10px; }
  .group-label::before { content:''; width:6px; height:18px; border-radius:3px; background:var(--c, var(--orange)); }

  /* ── 안내 본문 꾸미기 (시트의 글을 자동 변환) ── */
  .rich p { margin:0 0 8px; }
  .rich .gap { height:8px; }
  .rich .sub { display:inline-block; margin:10px 0 6px; padding:4px 12px; border-radius:999px;
    background:var(--c-soft, var(--navy-soft)); color:var(--navy); font-weight:800; font-size:14px; line-height:1.5; }
  .rich .sub-desc { margin:0 0 4px 4px; font-size:15px; }
  .rich .sub:first-child { margin-top:0; }
  .rich ul.bul { list-style:none; margin:0 0 6px; padding:0; }
  .rich ul.bul li { position:relative; padding-left:16px; margin:4px 0; }
  .rich ul.bul li::before { content:''; position:absolute; left:3px; top:.62em; width:6px; height:6px; border-radius:50%; background:var(--c, var(--orange)); }
  .rich ol.steps { list-style:none; margin:4px 0 8px; padding:0; counter-reset:s; }
  .rich ol.steps li { position:relative; padding:6px 0 6px 36px; counter-increment:s; }
  .rich ol.steps li::before { content:counter(s); position:absolute; left:0; top:6px; width:24px; height:24px; border-radius:50%;
    background:var(--navy); color:#fff; font-size:13px; font-weight:800; display:grid; place-items:center; }
  .rich ol.steps li:not(:last-child)::after { content:''; position:absolute; left:11px; top:32px; bottom:-4px; width:2px; background:var(--line); }
  .rich .path { background:#F7F8FC; border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin:6px 0 8px; }
  .rich .path .lbl { font-size:12px; font-weight:700; color:var(--muted); margin-bottom:4px; }
  .rich .path .crumbs { display:flex; flex-wrap:wrap; align-items:center; gap:4px; }
  .rich .path .crumb { background:#fff; border:1px solid var(--line); border-radius:8px; padding:2px 8px; font-size:13px; font-weight:600; color:var(--navy); }
  .rich .path .sep { color:var(--orange); font-weight:800; font-size:13px; }
  .rich .tip { display:flex; gap:8px; background:var(--orange-soft); border-radius:12px; padding:10px 12px; margin:6px 0 8px; font-size:14px; color:#5A3A00; }
  .rich .contact { display:flex; gap:10px; align-items:center; background:var(--navy); color:#fff; border-radius:14px; padding:10px 14px; margin-top:12px; font-size:14px; }
  .rich .contact .c-ico { width:30px; height:30px; border-radius:50%; background:var(--orange); display:grid; place-items:center; flex:none; }
  .rich .indent { color:var(--muted); font-size:14px; margin:-2px 0 6px 16px; }
  .rich b.num { color:var(--navy); background:linear-gradient(transparent 60%, rgba(255,158,27,.35) 60%); font-weight:800; padding:0 1px; }
  .link-btn { display:inline-flex; align-items:center; gap:4px; margin-top:12px; padding:8px 14px; border-radius:999px; background:var(--orange); color:#3D2400; font-weight:700; text-decoration:none; font-size:14px; }

  /* ── 질문하기 ── */
  .seg { display:grid; grid-template-columns:repeat(3,1fr); background:#E4E9F2; border-radius:14px; padding:4px; margin-bottom:16px; }
  .seg button { border:0; background:transparent; font:inherit; font-size:14px; padding:9px 0; border-radius:10px; color:var(--muted); cursor:pointer; }
  .seg button.active { background:#fff; color:var(--navy); font-weight:800; box-shadow:0 1px 3px rgba(0,32,91,.12); }
  .pane { display:none; }
  .pane.active { display:block; }
  .q-mark { color:var(--orange-deep); font-weight:900; margin-right:6px; }

  .form { background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:16px; }
  .field { margin-bottom:14px; }
  label { display:block; font-size:14px; font-weight:700; margin:0 0 6px; }
  .opt { font-weight:400; color:var(--muted); }
  input, textarea { width:100%; font:inherit; font-size:16px; padding:12px; border:1px solid var(--line);
    border-radius:12px; background:#fff; color:var(--text); }
  input:focus, textarea:focus { outline:2px solid var(--navy); outline-offset:-1px; border-color:var(--navy); }
  textarea { min-height:140px; resize:vertical; }
  .hint { font-size:13px; color:var(--muted); margin:6px 0 0; }
  .btn { width:100%; border:0; background:var(--navy); color:#fff; font:inherit; font-weight:800; font-size:16px;
    padding:14px; border-radius:14px; cursor:pointer; }
  .btn:active { background:var(--navy-dark); }
  .btn:disabled { opacity:.55; }
  .row { display:flex; gap:8px; }
  .row input { flex:1; min-width:0; letter-spacing:2px; }
  .row .btn { width:auto; padding:0 22px; flex:none; }

  .msg { border-radius:var(--radius); padding:16px; margin-top:14px; }
  .msg.ok { background:var(--orange-soft); }
  .msg.err { background:var(--danger-soft); color:var(--danger); }
  .ticket { font-size:34px; font-weight:900; letter-spacing:4px; color:var(--navy); margin:4px 0; }
  .result { margin-top:14px; padding:16px; }
  .result .label { font-weight:800; margin-top:12px; }
  .answer { background:var(--navy-soft); border-radius:12px; padding:12px; margin-top:6px; }
  .recent { margin-top:12px; }
  .chips { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-top:6px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { flex:none; border:1px solid var(--line); background:#fff; color:var(--text); padding:6px 12px;
    border-radius:999px; font:inherit; font-size:13px; cursor:pointer; }

  .empty { text-align:center; color:var(--muted); padding:40px 16px; }
  .empty .btn { width:auto; padding:10px 20px; margin-top:12px; font-size:15px; }
  .spinner { width:28px; height:28px; border:3px solid var(--navy-soft); border-top-color:var(--orange);
    border-radius:50%; animation:spin 1s linear infinite; margin:0 auto 12px; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* ── 일정 (달력) ── */
  .cal { background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:12px 10px 10px; }
  .cal-head { display:flex; align-items:center; justify-content:space-between; padding:0 4px 8px; }
  .cal-head h3 { margin:0; font-size:18px; font-weight:800; color:var(--navy); }
  .cal-nav { border:1px solid var(--line); background:#fff; width:36px; height:36px; border-radius:12px; font-size:18px; color:var(--navy); cursor:pointer; }
  .cal-today { border:0; background:var(--orange-soft); color:#7A4A00; font:inherit; font-size:13px; font-weight:700; padding:6px 10px; border-radius:999px; cursor:pointer; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
  .cal-wd { text-align:center; font-size:12px; font-weight:700; color:var(--muted); padding:4px 0; }
  .cal-wd.sun, .cal-day.off .n { color:#E0453A; }
  .cal-wd.sat { color:var(--blue); }
  .cal-day { min-height:54px; border:0; background:transparent; border-radius:12px; padding:4px 2px; display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer; font:inherit; color:var(--text); min-width:0; }
  .cal-day.blank { cursor:default; }
  .cal-day .n { font-size:14px; font-weight:600; width:26px; height:26px; line-height:26px; border-radius:50%; text-align:center; }
  .cal-day.sat:not(.off) .n { color:var(--blue); }
  .cal-day.today .n { background:var(--navy); color:#fff; }
  .cal-day.sel { background:var(--orange-soft); }
  .cal-day .hname { font-size:9px; color:#E0453A; line-height:1.1; max-width:100%; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .cal-day .dots { display:flex; gap:2px; justify-content:center; flex-wrap:wrap; }
  .cal-day .dot { width:6px; height:6px; border-radius:50%; background:var(--c); }
  .legend { display:flex; flex-wrap:wrap; gap:10px; font-size:12px; color:var(--muted); padding:8px 4px 0; }
  .legend span::before { content:''; display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--c); margin-right:4px; }
  .ev-head { display:flex; align-items:center; justify-content:space-between; margin:18px 2px 10px; }
  .ev-head h3 { margin:0; font-size:16px; font-weight:800; }
  .ev-head button { border:0; background:transparent; color:var(--muted); font:inherit; font-size:13px; cursor:pointer; text-decoration:underline; }
  .ev { display:flex; gap:12px; align-items:flex-start; background:#fff; border:1px solid var(--line); border-radius:16px; padding:12px 14px; margin-bottom:8px; }
  .ev .dbox { flex:none; width:46px; text-align:center; border-radius:12px; padding:4px 0; background:var(--c-soft); color:var(--navy); }
  .ev .dbox b { display:block; font-size:19px; line-height:1.2; }
  .ev .dbox small { font-size:11px; font-weight:700; }
  .ev .dbox.range b { font-size:12px; padding:4px 0; }
  .ev .ev-main { flex:1; min-width:0; }
  .ev .ev-title { font-weight:800; }
  .ev .ev-cat { display:inline-block; font-size:11px; font-weight:800; padding:1px 8px; border-radius:999px; background:var(--c-soft); color:var(--navy); margin-left:4px; vertical-align:2px; }
  .ev .ev-memo { font-size:13px; color:var(--muted); margin-top:2px; }
  .ev .ev-shift { display:inline-block; font-size:12px; font-weight:700; color:#7A4A00; background:var(--orange-soft); border-radius:8px; padding:2px 8px; margin-top:6px; }
  .upcoming { background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px 6px; margin-bottom:16px; }
  .upcoming h3 { margin:0 0 8px; font-size:15px; font-weight:800; display:flex; justify-content:space-between; align-items:center; }
  .upcoming h3 button { border:0; background:transparent; color:var(--navy); font:inherit; font-size:13px; font-weight:700; cursor:pointer; }
  .upcoming .ev { border:0; padding:8px 0; margin:0; border-top:1px dashed var(--line); border-radius:0; }
  .upcoming h3 + .ev { border-top:0; }
  .dday { flex:none; font-size:12px; font-weight:800; color:#3D2400; background:var(--orange); border-radius:999px; padding:2px 8px; align-self:center; }

  /* ── 공지 팝업 ── */
  .pop-dim { position:fixed; inset:0; z-index:50; background:rgba(0,16,46,.55); display:flex; align-items:center; justify-content:center; padding:24px 18px; }
  .pop-dim[hidden] { display:none; }
  .pop { width:100%; max-width:420px; max-height:min(80vh, 640px); background:#fff; border-radius:24px; overflow:hidden; display:flex; flex-direction:column;
    box-shadow:0 20px 50px rgba(0,0,0,.3); animation:popIn .25s ease-out; }
  @keyframes popIn { from { transform:translateY(16px) scale(.97); opacity:0; } to { transform:none; opacity:1; } }
  .pop-head { flex:none; background:var(--navy); color:#fff; padding:18px 20px 16px; position:relative; overflow:hidden; }
  .pop-head::after { content:''; position:absolute; right:-28px; top:-28px; width:96px; height:96px; border-radius:50%; background:var(--orange); }
  .pop-kicker { position:relative; z-index:1; font-size:13px; font-weight:800; color:var(--orange); display:flex; gap:8px; align-items:center; }
  .pop-kicker .cnt { color:#fff; opacity:.7; font-weight:600; }
  .pop-title { position:relative; z-index:1; margin:6px 0 2px; font-size:19px; font-weight:800; line-height:1.4; padding-right:40px; }
  .pop-date { position:relative; z-index:1; font-size:12px; opacity:.75; }
  .pop-body { flex:1; min-height:0; padding:16px 20px; overflow-y:auto; color:var(--body); -webkit-overflow-scrolling:touch; }
  .pop-foot { flex:none; display:grid; grid-template-columns:1fr 1fr; border-top:1px solid var(--line); }
  .pop-foot button { border:0; background:#fff; font:inherit; font-size:15px; padding:15px 0; cursor:pointer; color:var(--muted); }
  .pop-foot button + button { border-left:1px solid var(--line); color:var(--navy); font-weight:800; }

  /* ── 알림 (알림함·토스트) ── */
  .bar-btns { display:flex; align-items:center; }
  .bell { position:relative; }
  .bell-cnt { position:absolute; top:6px; right:4px; min-width:18px; height:18px; padding:0 5px; border-radius:999px; background:var(--orange);
    color:#3D2400; font-size:11px; font-weight:900; line-height:18px; text-align:center; box-shadow:0 0 0 2px var(--navy); }
  .bell-cnt[hidden] { display:none; }
  nav.tabbar button .tab-dot { position:absolute; top:10px; left:calc(50% + 8px); width:8px; height:8px; border-radius:50%; background:#E0453A; }
  nav.tabbar button .tab-dot[hidden] { display:none; }
  .inbox { position:fixed; inset:0; z-index:40; background:var(--bg); display:flex; flex-direction:column; animation:slideIn .22s ease-out; }
  .inbox[hidden] { display:none; }
  @keyframes slideIn { from { transform:translateX(30px); opacity:0; } to { transform:none; opacity:1; } }
  .inbox-head { background:var(--navy); color:#fff; display:flex; align-items:center; gap:4px; padding:10px 8px; padding-top:calc(10px + env(safe-area-inset-top)); }
  .inbox-head h2 { flex:1; margin:0; font-size:18px; font-weight:800; }
  .inbox-head .read-all { border:0; background:rgba(255,255,255,.12); color:#fff; font:inherit; font-size:13px; font-weight:700; padding:7px 12px; border-radius:999px; cursor:pointer; }
  .inbox-list { flex:1; overflow-y:auto; padding:12px 16px calc(24px + env(safe-area-inset-bottom)); max-width:640px; width:100%; margin:0 auto; }
  .noti { display:flex; gap:12px; align-items:flex-start; width:100%; text-align:left; font:inherit; color:var(--text); cursor:pointer;
    background:#fff; border:1px solid var(--line); border-radius:16px; padding:12px 14px; margin-bottom:8px; position:relative; }
  .noti.unread { border-color:var(--orange); background:#FFFBF4; }
  .noti .n-ico { flex:none; width:40px; height:40px; border-radius:14px; display:grid; place-items:center; font-size:20px; background:var(--navy-soft); }
  .noti.answer .n-ico { background:var(--orange-soft); }
  .noti .n-main { flex:1; min-width:0; }
  .noti .n-title { font-weight:800; font-size:15px; }
  .noti .n-text { font-size:14px; color:var(--body); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .noti .n-time { font-size:12px; color:var(--muted); margin-top:2px; }

(function () {
  var API = "https://script.google.com/macros/s/AKfycby1OC9KuWvA3Y6hCYNmHw_gb1atuJ6JZ1LSKoPmqsQP_kcyKgVzwut94XwciKlVOWcJ/exec";
  function get(params) { return fetch(API + '?' + new URLSearchParams(params)).then(function (r) { return r.json(); }); }
  function post(body) {
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); });
  }
  var api = {
    getData: function () { return get({ api: 'data' }); },
    checkQuestion: function (t) { return get({ api: 'check', ticket: t }); },
    checkTickets: function (list) { return get({ api: 'tickets', list: (list || []).join(',') }); },
    submitQuestion: function (f) { return post({ api: 'submit', form: f }); },
  };
  function make(ok, fail) {
    return new Proxy({}, { get: function (_, k) {
      if (k === 'withSuccessHandler') return function (f) { return make(f, fail); };
      if (k === 'withFailureHandler') return function (f) { return make(ok, f); };
      return function () {
        api[k].apply(null, arguments)
          .then(function (res) {
            if (!res || !res.ok) throw new Error((res && res.error) || '잠시 후 다시 시도해 주세요.');
            ok && ok(res.data);
          })
          .catch(function (e) {
            fail && fail(e instanceof TypeError ? new Error('인터넷 연결을 확인해 주세요.') : e);
          });
      };
    } });
  }
  window.google = { script: { run: make() } };
})();

  function inline(t) { return mark(esc(t)); }

  /* 시트에 쓴 글을 보기 좋게 바꾼다. 규칙:
     ■ 제목 → 소제목 배지 / • 항목 → 점 목록 / 1. 단계 → 번호 단계 / 메뉴:·모바일:·결재: A > B → 경로 버튼
     예)·※ → 팁 상자 / 문의: → 연락처 상자 / 공백으로 시작 → 보충 설명 */
  function rich(text) {
    const lines = String(text || '').split('\n');
    let html = '', list = null;
    const close = () => { if (list) { html += `</${list}>`; list = null; } };
    const open = tag => { if (list !== tag) { close(); html += tag === 'ul' ? '<ul class="bul">' : '<ol class="steps">'; list = tag; } };
    /* '■ 회갑·칠순: 휴가 1일 / 30만원'처럼 콜론 뒤 내용이 있으면 배지는 앞부분만, 내용은 아래 줄로 */
    const subHtml = t => {
      const k = t.indexOf(':');
      if (k > 0 && k < 40 && t.slice(k + 1).trim()) {
        return `<div class="sub">${esc(t.slice(0, k).trim())}</div><div class="sub-desc">${inline(t.slice(k + 1).trim())}</div>`;
      }
      return `<div class="sub">${inline(t)}</div>`;
    };
    const crumbs = s => s.split(/\s+>\s+/).map(p => `<span class="crumb">${esc(p)}</span>`).join('<span class="sep">›</span>');

    lines.forEach(raw => {
      const line = raw.trim();
      let m;
      if (!line) { close(); html += '<div class="gap"></div>'; return; }
      if (/^\s{2,}/.test(raw)) { close(); html += `<div class="indent">${inline(line)}</div>`; return; }
      if ((m = line.match(/^■\s*(.+)$/))) { close(); html += subHtml(m[1]); return; }
      if ((m = line.match(/^[•·\-]\s*(.+)$/))) { open('ul'); html += `<li>${inline(m[1])}</li>`; return; }
      if ((m = line.match(/^\d+\.\s+(.+)$/))) { open('ol'); html += `<li>${inline(m[1])}</li>`; return; }
      close();
      if ((m = line.match(/^(메뉴|모바일|결재)\s*:\s*(.+)$/))) {
        const lbl = { '메뉴': '📱 어디서 신청하나요?', '모바일': '📲 모바일에서는', '결재': '✅ 결재 순서' }[m[1]];
        html += `<div class="path"><div class="lbl">${lbl}</div><div class="crumbs">${crumbs(m[2])}</div></div>`;
        return;
      }
      if ((m = line.match(/^문의\s*:\s*(.+)$/))) {
        html += `<div class="contact"><span class="c-ico" aria-hidden="true">☎</span><span><b>문의</b> ${esc(m[1])}</span></div>`;
        return;
      }
      if (/^(예\)|※)/.test(line)) { html += `<div class="tip"><span aria-hidden="true">💡</span><span>${inline(line.replace(/^(예\)|※)\s*/, ''))}</span></div>`; return; }
      if ((m = line.match(/^([①-⑩])\s*(.+)$/))) { html += subHtml(m[1] + ' ' + m[2]); return; }
      html += `<p>${inline(line)}</p>`;
    });
    close();
    return `<div class="rich">${html}</div>`;
  }

  function call(fn, ...args) {
    return new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
    });
  }

  function emptyHtml(text) { return `<div class="empty">${esc(text)}</div>`; }
  function loadingHtml() { return '<div class="empty"><div class="spinner"></div>불러오는 중…</div>'; }
  function showMsg(target, kind, text) { $(target).innerHTML = `<div class="msg ${kind}">${esc(text)}</div>`; }

  /* ── 데이터 불러오기 ── */

  const DATA_KEY = 'welfare.data';

  function show(d) { state.data = d; renderNotices(); renderBenefits(); renderFaq(); initSchedule(); openPopups(); refreshNotis(); }

  function load() {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(DATA_KEY)); } catch (e) {}
    if (saved && saved.notices) show(saved);
    else {
      ['#notice-list', '#benefit-list', '#faq-list'].forEach(s => $(s).innerHTML = loadingHtml());
      $('#cat-tiles').innerHTML = '';
    }
    call('getData')
      .then(d => {
        try { localStorage.setItem(DATA_KEY, JSON.stringify(d)); } catch (e) {}
        if (!saved || JSON.stringify(saved) !== JSON.stringify(d)) show(d);
      })
      .catch(err => {
        if (saved && saved.notices) return;
        const html = `<div class="empty">불러오지 못했습니다.<br>${esc(errText(err))}<br><button class="btn" type="button" data-retry>다시 시도</button></div>`;
        ['#notice-list', '#benefit-list', '#faq-list'].forEach(s => $(s).innerHTML = html);
      });
  }

  function renderNotices() {
    const list = state.data.notices;
    $('#notice-list').innerHTML = list.length ? list.map(n => `
      <details class="card${n.important ? ' important' : ''}" data-nid="${esc(popId(n))}"${n.important ? ' open' : ''}>
        <summary>
          <div class="ico" style="--c-soft:${n.important ? '#FFF2DF' : '#E8EDF7'}" aria-hidden="true">${n.important ? '📣' : '📝'}</div>
          <div class="sum-main">
            <div class="sum-title">${n.important ? '<span class="badge important">중요</span>' : ''}${esc(n.title)}</div>
            ${n.date ? `<div class="sum-meta">${esc(n.date)}</div>` : ''}
          </div>${CHEV}
        </summary>
        <div class="body">${rich(n.content)}</div>
      </details>`).join('') : emptyHtml('등록된 공지가 없습니다.');
  }

  function benefitCard(b, st) {
    return `
      <details class="card" style="${catVars(st)}">
        <summary>
          <div class="ico" aria-hidden="true">${st.icon}</div>
          <div class="sum-main"><div class="sum-title">${esc(b.title)}</div></div>${CHEV}
        </summary>
        <div class="body">${rich(b.content)}
          ${isHttp(b.link) ? `<a class="link-btn" href="${esc(b.link)}" target="_blank" rel="noopener">자세히 보기 →</a>` : ''}
        </div>
      </details>`;
  }

  function renderBenefits() {
    const items = state.data.benefits;
    const cats = [...new Set(items.map(b => b.category))];
    const styles = {};
    cats.forEach((c, i) => styles[c] = catStyle(c, i));
    if (!cats.includes(state.cat)) state.cat = '전체';

    if (!items.length) {
      $('#cat-tiles').innerHTML = '';
      $('#benefit-list').innerHTML = emptyHtml('등록된 복리후생 안내가 없습니다.');
      return;
    }

    const tile = (c, icon, cnt, vars) => `
      <button class="tile${c === state.cat ? ' active' : ''}" data-cat="${esc(c)}" style="${vars}">
        <span class="t-ico" aria-hidden="true">${icon}</span>
        <span class="t-name">${esc(c)}</span>
        <span class="t-cnt">${cnt}개</span>
      </button>`;
    $('#cat-tiles').innerHTML = cats.length > 1
      ? tile('전체', '✨', items.length, '--c-soft:#FFF2DF') +
        cats.map(c => tile(c, styles[c].icon, items.filter(b => b.category === c).length, catVars(styles[c]))).join('')
      : '';

    const shown = state.cat === '전체' ? cats : [state.cat];
    $('#benefit-list').innerHTML = shown.map(c =>
      `<div class="group-label" style="${catVars(styles[c])}">${styles[c].icon} ${esc(c)}</div>` +
      items.filter(b => b.category === c).map(b => benefitCard(b, styles[c])).join('')
    ).join('');
  }

  function renderFaq() {
    const list = state.data.faq;
    $('#faq-list').innerHTML = list.length ? list.map(f => `
      <details class="card">
        <summary><div class="sum-main"><div class="sum-title"><span class="q-mark">Q.</span>${esc(f.question)}</div></div>${CHEV}</summary>
        <div class="body"><div class="answer">${nl(f.answer)}</div></div>
      </details>`).join('') : emptyHtml('아직 등록된 자주 묻는 질문이 없습니다.');
  }

  /* ── 일정 (달력) ──
     시트 [일정]의 규칙을 달력 날짜로 펼친다. [휴일이면]이 전/다음 영업일이면 주말과 [휴일] 시트 날짜를 피해 옮긴다. */

  const EV_COLOR = { '급여': '#FF9E1B', '대출': '#418FDE', '포상': '#7D55C7', '마감': '#FF7F32', '복리후생': '#00205B', '행사': '#FFC56E' };
  const WD = ['일', '월', '화', '수', '목', '금', '토'];
  const pad2 = n => String(n).padStart(2, '0');
  const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const md = s => { const d = parseYmd(s); return `${d.getMonth() + 1}/${d.getDate()}(${WD[d.getDay()]})`; };
  const isYmd = s => /^\d{4}-\d{2}-\d{2}$/.test(s || '');
  const cal = { y: 0, m: 0, sel: '' };
  let holidayMap = new Map();

  function evColor(cat) { return EV_COLOR[cat] || '#00205B'; }
  function evVars(cat) { const c = evColor(cat); return `--c:${c};--c-soft:${c}22`; }
  function isOff(d) { return d.getDay() === 0 || d.getDay() === 6 || holidayMap.has(ymd(d)); }
  function shiftDay(d, rule) {
    const step = /전/.test(rule) ? -1 : /다음/.test(rule) ? 1 : 0;
    if (!step) return d;
    const x = new Date(d);
    for (let i = 0; i < 14 && isOff(x); i++) x.setDate(x.getDate() + step);
    return x;
  }

  /* 해당 달의 일정. kind: one(하루), start/end(기간 시작·끝), ongoing(이 달 내내 진행 중) */
  function monthItems(y, m) {
    const first = ymd(new Date(y, m, 1)), lastD = new Date(y, m + 1, 0), last = ymd(lastD);
    const inMonth = s => s >= first && s <= last;
    const out = [];
    ((state.data && state.data.events) || []).forEach(ev => {
      if (ev.repeat === '매월') {
        if (!ev.day) return;
        const base = new Date(y, m, Math.min(ev.day, lastD.getDate()));
        const adj = shiftDay(base, ev.shift);
        out.push({ ev, date: ymd(adj), orig: ymd(adj) !== ymd(base) ? ymd(base) : '', kind: 'one' });
        return;
      }
      if (!isYmd(ev.date)) return;
      if (isYmd(ev.end) && ev.end > ev.date) {
        if (inMonth(ev.date)) out.push({ ev, date: ev.date, kind: 'start' });
        if (inMonth(ev.end)) out.push({ ev, date: ev.end, kind: 'end' });
        if (ev.date < first && ev.end > last) out.push({ ev, date: '', kind: 'ongoing' });
        return;
      }
      const adj = shiftDay(parseYmd(ev.date), ev.shift);
      out.push({ ev, date: ymd(adj), orig: ymd(adj) !== ev.date ? ev.date : '', kind: 'one' });
    });
    return out.filter(it => it.kind === 'ongoing' || inMonth(it.date))
      .sort((a, b) => (a.date || '0').localeCompare(b.date || '0'));
  }

  function evCard(it, dday) {
    const ev = it.ev;
    let box;
    if (it.kind === 'ongoing') {
      box = `<div class="dbox range"><b>${esc(md(ev.date).split('(')[0])}<br>~${esc(md(ev.end).split('(')[0])}</b></div>`;
    } else {
      const d = parseYmd(it.date);
      box = `<div class="dbox"><b>${d.getDate()}</b><small>${WD[d.getDay()]}</small></div>`;
    }
    const tag = it.kind === 'start' ? ' 시작' : it.kind === 'end' ? ' 종료' : it.kind === 'ongoing' ? ' 진행 중' : '';
    const range = isYmd(ev.end) && ev.end > ev.date ? `<div class="ev-memo">기간 ${esc(md(ev.date))} ~ ${esc(md(ev.end))}</div>` : '';
    const shift = it.orig ? `<span class="ev-shift">원래 ${esc(md(it.orig))} → 휴일이라 ${esc(md(it.date))}</span>` : '';
    const badge = dday != null ? `<span class="dday">${dday === 0 ? '오늘' : 'D-' + dday}</span>` : '';
    return `<div class="ev" style="${evVars(ev.cat)}">${box}
      <div class="ev-main">
        <div class="ev-title">${esc(ev.title)}${esc(tag)}${ev.cat ? `<span class="ev-cat">${esc(ev.cat)}</span>` : ''}</div>
        ${range}${ev.memo ? `<div class="ev-memo">${esc(ev.memo)}</div>` : ''}${shift}
      </div>${badge}</div>`;
  }

  function renderCalendar() {
    const { y, m } = cal;
    const items = monthItems(y, m);
    const byDate = {};
    items.forEach(it => { if (it.date) (byDate[it.date] = byDate[it.date] || []).push(it); });
    const today = ymd(new Date());
    $('#cal-title').textContent = `${y}년 ${m + 1}월`;

    let html = WD.map((w, i) => `<div class="cal-wd${i === 0 ? ' sun' : i === 6 ? ' sat' : ''}">${w}</div>`).join('');
    const startPad = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate();
    for (let i = 0; i < startPad; i++) html += '<div class="cal-day blank"></div>';
    for (let dnum = 1; dnum <= days; dnum++) {
      const d = new Date(y, m, dnum), key = ymd(d), list = byDate[key] || [];
      const cls = ['cal-day', isOff(d) ? 'off' : '', d.getDay() === 6 ? 'sat' : '', key === today ? 'today' : '', key === cal.sel ? 'sel' : ''].join(' ');
      const hname = holidayMap.get(key);
      html += `<button class="${cls}" data-date="${key}"><span class="n">${dnum}</span>`
        + (hname ? `<span class="hname">${esc(hname)}</span>` : '')
        + `<span class="dots">${list.slice(0, 4).map(it => `<span class="dot" style="--c:${evColor(it.ev.cat)}"></span>`).join('')}</span></button>`;
    }
    $('#cal-grid').innerHTML = html;

    const cats = [...new Set(((state.data && state.data.events) || []).map(e => e.cat).filter(Boolean))];
    $('#cal-legend').innerHTML = cats.map(c => `<span style="--c:${evColor(c)}">${esc(c)}</span>`).join('');

    const shown = cal.sel ? items.filter(it => it.date === cal.sel) : items;
    $('#ev-title').textContent = cal.sel ? `${md(cal.sel)} 일정` : `${m + 1}월 일정`;
    $('#ev-all').hidden = !cal.sel;
    $('#ev-list').innerHTML = shown.length ? shown.map(it => evCard(it)).join('') : emptyHtml(cal.sel ? '이 날은 일정이 없어요.' : '이번 달 일정이 없어요.');
  }

  function renderUpcoming() {
    const now = new Date(), today = ymd(now);
    const next = new Date(now.getFullYear(), now.getMonth() + 1, 1);
    const items = [...monthItems(now.getFullYear(), now.getMonth()), ...monthItems(next.getFullYear(), next.getMonth())]
      .filter(it => it.date && it.date >= today).slice(0, 3);
    if (!items.length) { $('#upcoming').innerHTML = ''; return; }
    const t0 = parseYmd(today).getTime();
    $('#upcoming').innerHTML = `<div class="upcoming"><h3>📅 다가오는 일정 <button type="button" data-goto="schedule">달력 보기 ›</button></h3>`
      + items.map(it => evCard(it, Math.round((parseYmd(it.date).getTime() - t0) / 86400000))).join('') + '</div>';
  }

  function initSchedule() {
    holidayMap = new Map((state.data.holidays || []).map(h => [h.date, h.name]));
    if (!cal.y) { const n = new Date(); cal.y = n.getFullYear(); cal.m = n.getMonth(); }
    renderCalendar();
    renderUpcoming();
  }

  function moveMonth(step) {
    const d = new Date(cal.y, cal.m + step, 1);
    cal.y = d.getFullYear(); cal.m = d.getMonth(); cal.sel = '';
    renderCalendar();
  }

  /* ── 공지 팝업 ──
     시트 [공지사항]의 [팝업]을 체크한 공지를 앱을 열 때 보여 준다.
     '오늘 하루 보지 않기'는 이 기기에 날짜를 기억하고, '닫기'는 이번에 연 동안만 숨긴다. */

  const POP_KEY = 'welfare.popup.hidden';
  const popShown = new Set();
  let popQueue = [];

  function popId(n) { return n.date + '|' + n.title; }
  function todayStr() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
  function popHidden() { try { return JSON.parse(localStorage.getItem(POP_KEY)) || {}; } catch (e) { return {}; } }

  function openPopups() {
    const hidden = popHidden(), today = todayStr();
    popQueue = (state.data.notices || []).filter(n => n.popup && hidden[popId(n)] !== today && !popShown.has(popId(n)));
    popQueue.forEach(n => popShown.add(popId(n)));
    showPopup(0);
  }

  function showPopup(i) {
    const n = popQueue[i];
    if (!n) { $('#pop').hidden = true; document.body.style.overflow = ''; flushToast(); return; }
    $('#pop').dataset.i = i;
    $('#pop-cnt').textContent = popQueue.length > 1 ? `${i + 1} / ${popQueue.length}` : '';
    $('#pop-title').textContent = n.title;
    $('#pop-date').textContent = n.date || '';
    $('#pop-body').innerHTML = rich(n.content);
    $('#pop-body').scrollTop = 0;
    $('#pop-close').textContent = i < popQueue.length - 1 ? '다음' : '닫기';
    $('#pop').hidden = false;
    document.body.style.overflow = 'hidden';
  }

  function nextPopup(hideToday) {
    const i = Number($('#pop').dataset.i || 0);
    if (hideToday && popQueue[i]) {
      const h = popHidden();
      h[popId(popQueue[i])] = todayStr();
      try { localStorage.setItem(POP_KEY, JSON.stringify(h)); } catch (e) {}
    }
    showPopup(i + 1);
  }

  /* ── 앱 안 알림 · 알림함 ──
     이 휴대폰에서 남긴 질문(접수번호)에 답변이 달렸는지 앱을 열 때 확인한다.
     알림함에는 답변 알림과 최근 2주 공지를 보여 준다. 읽음 여부는 이 기기에만 저장한다. */

  const NOTI_KEY = 'welfare.notif';
  let notis = [];
  let pendingToast = null;

  function notiStore() {
    try { const s = JSON.parse(localStorage.getItem(NOTI_KEY)); if (s && s.read) return { toasted: {}, ...s }; } catch (e) {}
    return { read: {}, toasted: {} };
  }
  function saveNotiStore(s) { try { localStorage.setItem(NOTI_KEY, JSON.stringify(s)); } catch (e) {} }
  function markRead(id) { const s = notiStore(); if (!s.read[id]) { s.read[id] = 1; saveNotiStore(s); renderNotiBadge(); renderInbox(); } }

  function refreshNotis() {
    const tickets = getTickets();
    if (!tickets.length) { buildNotis([]); return; }
    call('checkTickets', tickets).then(buildNotis).catch(() => buildNotis([]));
  }

  function buildNotis(answers) {
    const items = [];
    (answers || []).filter(a => a.answered).forEach(a => items.push({
      id: `ans:${a.ticket}:${a.answeredAt}`, kind: 'answer', icon: '💬',
      title: '질문에 답변이 등록됐어요', text: `접수번호 ${a.ticket} · ${a.question}`, time: a.answeredAt, ticket: a.ticket,
    }));
    const since = new Date(); since.setDate(since.getDate() - 14);
    const cutoff = ymd(since);
    ((state.data && state.data.notices) || []).filter(n => n.date && n.date >= cutoff).forEach(n => items.push({
      id: 'notice:' + popId(n), kind: 'notice', icon: n.important ? '📣' : '📝',
      title: n.important ? '중요 공지' : '새 공지', text: n.title, time: n.date, nid: popId(n),
    }));
    items.sort((a, b) => (b.time || '').localeCompare(a.time || ''));
    notis = items;
    renderNotiBadge();
    renderInbox();

    const s = notiStore();
    const fresh = items.find(it => it.kind === 'answer' && !s.read[it.id] && !s.toasted[it.id]);
    if (fresh) { s.toasted[fresh.id] = 1; saveNotiStore(s); pendingToast = fresh; if ($('#pop').hidden) flushToast(); }
  }

  function renderNotiBadge() {
    const s = notiStore();
    const unread = notis.filter(n => !s.read[n.id]);
    const cnt = $('#bell-cnt');
    cnt.hidden = !unread.length;
    cnt.textContent = unread.length > 9 ? '9+' : unread.length;
    $('#qna-dot').hidden = !unread.some(n => n.kind === 'answer');
  }

  function renderInbox() {
    const s = notiStore();
    $('#inbox-list').innerHTML = notis.length ? notis.map((n, i) => `
      <button type="button" class="noti ${n.kind}${s.read[n.id] ? '' : ' unread'}" data-noti="${i}">
        <span class="n-ico" aria-hidden="true">${n.icon}</span>
        <span class="n-main">
          <span class="n-title" style="display:block">${esc(n.title)}</span>
          <span class="n-text" style="display:block">${esc(n.text)}</span>
          <span class="n-time" style="display:block">${esc(n.time || '')}</span>
        </span>
      </button>`).join('')
      : emptyHtml('아직 알림이 없어요. 질문을 남기면 답변이 달릴 때 여기서 알려 드려요.');
  }

  function openInbox() { $('#toast').hidden = true; renderInbox(); $('#inbox').hidden = false; document.body.style.overflow = 'hidden'; }
  function closeInbox() { $('#inbox').hidden = true; document.body.style.overflow = ''; }

  function goNoti(n) {
    markRead(n.id);
    closeInbox();
    $('#toast').hidden = true;
    if (n.kind === 'answer') {
      showTab('qna'); showPane('check');
      $('#ticket').value = n.ticket;
      check(n.ticket);
    } else {
      showTab('notice');
      const card = [...document.querySelectorAll('#notice-list details')].find(d => d.dataset.nid === n.nid);
      if (card) { card.open = true; card.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    }
  }

  function flushToast() {
    if (!pendingToast) return;
    const n = pendingToast; pendingToast = null;
    $('#toast-text').textContent = n.text;
    $('#toast').dataset.id = n.id;
    $('#toast').hidden = false;
    clearTimeout(flushToast.t);
    flushToast.t = setTimeout(() => { $('#toast').hidden = true; }, 8000);
  }

  /* ── 탭 ── */

  function showTab(name) {
    $$('.tab').forEach(t => t.classList.toggle('active', t.id === 'tab-' + name));
    $$('nav.tabbar button').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
    window.scrollTo(0, 0);
  }

  function showPane(name) {
    $$('.pane').forEach(p => p.classList.toggle('active', p.id === 'pane-' + name));
    $$('.seg button').forEach(b => b.classList.toggle('active', b.dataset.pane === name));
  }

  /* ── 내 접수번호 (이 기기에만 저장) ── */

  function getTickets() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; } catch (e) { return []; }
  }
  function saveTicket(t) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify([t, ...getTickets().filter(x => x !== t)].slice(0, 5))); } catch (e) {}
  }
  function renderRecent() {
    const list = getTickets();
    $('#recent').innerHTML = list.length ? `<div class="hint">이 휴대폰에서 남긴 질문</div>
      <div class="chips">${list.map(t => `<button type="button" class="chip" data-ticket="${esc(t)}">${esc(t)}</button>`).join('')}</div>` : '';
  }

  /* ── 질문 남기기 ── */

  $('#ask-form').addEventListener('submit', e => {
    e.preventDefault();
    const question = $('#question').value.trim();
    if (!question) { showMsg('#ask-result', 'err', '질문 내용을 입력해 주세요.'); $('#question').focus(); return; }

    const btn = $('#ask-btn');
    btn.disabled = true; btn.textContent = '보내는 중…';
    call('submitQuestion', { dept: $('#dept').value, name: $('#name').value, question })
      .then(r => {
        saveTicket(r.ticket);
        renderRecent();
        $('#ask-form').reset();
        $('#ask-result').innerHTML = `
          <div class="msg ok">
            질문이 접수되었어요 🙌 접수번호를 꼭 기록해 두세요.
            <div class="ticket">${esc(r.ticket)}</div>
            <div class="hint">답변이 등록되면 '답변 확인'에서 이 번호로 볼 수 있습니다.</div>
          </div>`;
      })
      .catch(err => showMsg('#ask-result', 'err', errText(err)))
      .finally(() => { btn.disabled = false; btn.textContent = '질문 보내기'; });
  });

  /* ── 답변 확인 ── */

  function check(ticket) {
    if (!/^\d{6}$/.test(ticket)) { showMsg('#check-result', 'err', '접수번호 6자리를 입력해 주세요.'); return; }
    const btn = $('#check-btn');
    btn.disabled = true;
    $('#check-result').innerHTML = loadingHtml();
    call('checkQuestion', ticket)
      .then(r => {
        if (!r.found) { showMsg('#check-result', 'err', '해당 접수번호의 질문을 찾을 수 없습니다. 번호를 다시 확인해 주세요.'); return; }
        if (r.answer) markRead(`ans:${r.ticket}:${r.answeredAt}`);
        $('#check-result').innerHTML = `
          <div class="card result">
            ${r.answer ? '<span class="badge done">답변 완료</span>' : '<span class="badge wait">답변 대기</span>'}
            <div class="sum-meta">접수번호 ${esc(r.ticket)} · ${esc(r.createdAt)}</div>
            <div class="label">질문</div>
            <div style="color:var(--body)">${nl(r.question)}</div>
            ${r.answer
              ? `<div class="label">답변${r.answeredAt ? ` <span class="sum-meta">${esc(r.answeredAt)}</span>` : ''}</div>
                 <div class="answer">${nl(r.answer)}</div>`
              : '<p class="hint">아직 답변이 등록되지 않았습니다. 조금만 기다려 주세요 🙏</p>'}
          </div>`;
      })
      .catch(err => showMsg('#check-result', 'err', errText(err)))
      .finally(() => { btn.disabled = false; });
  }

  $('#check-form').addEventListener('submit', e => { e.preventDefault(); check($('#ticket').value.trim()); });
  $('#ticket').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6); });
  $('#recent').addEventListener('click', e => {
    const b = e.target.closest('[data-ticket]');
    if (!b) return;
    $('#ticket').value = b.dataset.ticket;
    check(b.dataset.ticket);
  });

  /* ── 이벤트 연결 ── */

  $$('nav.tabbar button').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));
  $$('.seg button').forEach(b => b.addEventListener('click', () => showPane(b.dataset.pane)));
  $('#cat-tiles').addEventListener('click', e => {
    const b = e.target.closest('[data-cat]');
    if (!b) return;
    state.cat = b.dataset.cat;
    renderBenefits();
    $('#benefit-list').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  $('#refresh').addEventListener('click', load);
  $('#bell').addEventListener('click', openInbox);
  $('#inbox-back').addEventListener('click', closeInbox);
  $('#inbox-read').addEventListener('click', () => { const st = notiStore(); notis.forEach(n => st.read[n.id] = 1); saveNotiStore(st); renderNotiBadge(); renderInbox(); });
  $('#inbox-list').addEventListener('click', e => { const b = e.target.closest('[data-noti]'); if (b) goNoti(notis[Number(b.dataset.noti)]); });
  $('#toast-go').addEventListener('click', () => { const n = notis.find(x => x.id === $('#toast').dataset.id); if (n) goNoti(n); });
  $('#toast-x').addEventListener('click', () => { $('#toast').hidden = true; });
  $('#pop-close').addEventListener('click', () => nextPopup(false));
  $('#pop-today').addEventListener('click', () => nextPopup(true));
  $('#pop').addEventListener('click', e => { if (e.target.id === 'pop') nextPopup(false); });
  $('#cal-prev').addEventListener('click', () => moveMonth(-1));
  $('#cal-next').addEventListener('click', () => moveMonth(1));
  $('#cal-now').addEventListener('click', () => { const n = new Date(); cal.y = n.getFullYear(); cal.m = n.getMonth(); cal.sel = ''; renderCalendar(); });
  $('#cal-grid').addEventListener('click', e => {
    const b = e.target.closest('[data-date]');
    if (!b) return;
    cal.sel = cal.sel === b.dataset.date ? '' : b.dataset.date;
    renderCalendar();
  });
  $('#ev-all').addEventListener('click', () => { cal.sel = ''; renderCalendar(); });
  document.addEventListener('click', e => { const g = e.target.closest('[data-goto]'); if (g) showTab(g.dataset.goto); });
  document.addEventListener('click', e => { if (e.target.closest('[data-retry]')) load(); });

  renderRecent();
  load();
</script>

<div id="install" class="install" hidden>
  <img src="icons/icon-192.png" alt="">
  <div class="ins-txt"><b>홈 화면에 추가하면 앱처럼 쓸 수 있어요</b><span id="ins-how"></span></div>
  <button id="ins-btn" type="button" hidden>추가</button>
  <button id="ins-x" type="button" aria-label="닫기">✕</button>
</div>
<script>
(function () {
  var KEY = 'welfare.install.dismissed';
  var box = document.getElementById('install');
  var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  var dismissed = false;
  try { dismissed = localStorage.getItem(KEY) === '1'; } catch (e) {}
  var deferred = null;

  function show(how, withButton) {
    if (standalone || dismissed) return;
    document.getElementById('ins-how').textContent = how;
    document.getElementById('ins-btn').hidden = !withButton;
    box.hidden = false;
  }
  function hide(remember) {
    box.hidden = true;
    if (remember) { try { localStorage.setItem(KEY, '1'); } catch (e) {} }
  }

  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferred = e;
    show('추가 버튼을 누르면 바로 설치돼요.', true);
  });
  if (/iphone|ipad|ipod/i.test(navigator.userAgent)) {
    show('사파리 아래쪽 공유 버튼(□↑)을 누르고 "홈 화면에 추가"를 고르세요.', false);
  }
  document.getElementById('ins-btn').addEventListener('click', function () {
    if (!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function () { deferred = null; hide(true); });
  });
  document.getElementById('ins-x').addEventListener('click', function () { hide(true); });
  window.addEventListener('appinstalled', function () { hide(true); });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
</body>
</html>
